<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <!-- Background Shield/Badge Icon -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="80" height="80" rx="20" fill="#E63946"/>
    <!-- Toy Block / Bear Ears Motif -->
    <circle cx="28" cy="25" r="10" fill="#FFFFFF"/>
    <circle cx="52" cy="25" r="10" fill="#FFFFFF"/>
    <rect x="20" y="32" width="40" height="34" rx="8" fill="#FFFFFF"/>
    <!-- Smile -->
    <path d="M 32 52 Q 40 60 48 52" stroke="#E63946" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Eyes -->
    <circle cx="32" cy="42" r="3" fill="#2A2D34"/>
    <circle cx="48" cy="42" r="3" fill="#2A2D34"/>
  </g>
  
  <!-- Brand Text -->
  <text x="105" y="58" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="42" fill="#FFFFFF" letter-spacing="1">TOY</text>
  <text x="200" y="58" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="42" fill="#E63946" letter-spacing="1">HAVEN</text>
  <text x="107" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="14" fill="#6C757D" letter-spacing="3">COLLECTIBLES &amp; TOYS</text>
</svg>
