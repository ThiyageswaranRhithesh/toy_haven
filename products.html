<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toy Haven | Products</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
  <script src="products-data.js" defer></script><script src="carousel.js" defer></script><script src="script.js" defer></script>
<meta name="description" content="Toy Haven | Products — Browse toys, figurines, board games and diecast cars."><meta name="theme-color" content="#1c1e25"></head>
<body>

  <!-- Header -->
  <header>
    <a href="index.html" class="logo">
      <img src="logo.svg" alt="Toy Haven Logo">
    </a>
    <nav aria-label="Main Navigation">
      <button class="hamburger" aria-expanded="false" aria-controls="main-menu" aria-label="Toggle Navigation Menu">
        <span></span><span></span><span></span>
      </button>
      <ul id="main-menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html" class="active" aria-current="page">Products</a></li>
        <li><a href="wishlist.html">Wishlist</a></li>
        <li><a href="cart.html">Cart</a></li>
        <li><a href="support.html">Support</a></li>
      </ul>
    </nav>
  </header>

  <!-- Main Catalog Layout Container -->
  <main class="products-layout">
    <!-- Filtering & Search Sidebar -->
    <aside class="filters-sidebar">
      <h2>Filter Products</h2>
      <form id="filter-form">
        <!-- Live Search Input -->
        <search>
          <label for="product-search">Search:</label>
          <input type="search" id="product-search" placeholder="Search toys...">
        </search>
        
        <!-- Category Filter Radio Group -->
        <fieldset>
          <legend>Categories</legend>
          <label><input type="radio" name="category" value="all" checked> All Products</label>
          <label><input type="radio" name="category" value="Figurines"> Figurines</label>
          <label><input type="radio" name="category" value="Toys"> Toys</label>
          <label><input type="radio" name="category" value="Board Games"> Board Games</label>
          <label><input type="radio" name="category" value="Diecast Cars"> Diecast Cars</label>
        </fieldset>
      </form>
    </aside>

    <!-- Interactive Product Grid Section -->
    <section class="product-catalog" aria-live="polite" id="product-catalog">
      <h1>All Products</h1><noscript>Please enable JavaScript to browse products.</noscript></section>
  </main>

  <!-- Footer -->
  <footer>
    <section class="footer-newsletter" aria-labelledby="newsletter-title">
      <div>
        <h2 id="newsletter-title">Stay Updated</h2>
        <p>Subscribe to our newsletter for exclusive offers and new arrivals.</p>
      </div>
      <form id="newsletter-form">
        <label for="newsletter-email" class="visually-hidden">Email Address</label>
        <input type="email" id="newsletter-email" name="email" autocomplete="email" placeholder="Enter your email" required>
        <button type="submit">Subscribe</button>
      </form>
    </section>
    <nav aria-label="Footer Navigation">
      <ul>
        <li><a href="products.html">Shop All</a></li>
        <li><a href="support.html">FAQ &amp; Support</a></li>
      </ul>
    </nav>
    <p>© 2026 Toy Haven. All rights reserved.</p>
  </footer>

</body>
</html>
